name: Trigger Protocol Conformance

on:
  push:
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run protocol conformance tests
        run: python conformance/test_conformance.py

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run MCP proxy tests
        run: npm test
